name: 🐛 问题反馈（Bug）
description: 签到失败、登录异常、界面错乱等问题
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！提交前请先搜索已有 Issue。
        **请勿粘贴 token、refreshToken、cookie、storage.json 完整内容或完整响应报文。**
        应用内「长按日志复制」的输出已脱敏，可以直接粘贴。

  - type: input
    id: app_version
    attributes:
      label: 应用版本
      description: 设置页「关于 → 版本」，例如 2.4.2
      placeholder: "2.4.2"
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: 机型与 Android 版本
      placeholder: "OPPO Find X7 / Android 14"
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 1. 打开 App → 2. 点哪里 → 3. 出现什么
      placeholder: |
        1. 点「一键签到」
        2. 弹窗显示成功
        3. 账号卡片仍显示待签到
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志（长按日志条目复制的完整报错）
      description: 含 code / device_src / req_source 等字段，不含凭据
      render: text
    validations:
      required: false

  - type: dropdown
    id: scene
    attributes:
      label: 问题出现的环节
      options:
        - 添加账号 / 登录
        - 一键签到 / 定时签到
        - 积分查询
        - 设置 / 开关
        - 界面显示
        - 其它
    validations:
      required: true

  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已确认日志/描述中不含任何登录凭据或完整响应体
          required: true
        - label: 我已确认是从官方 Release 获取的 APK
          required: true
